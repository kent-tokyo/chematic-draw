[package]
name = "chem-wasm"
version = "0.5.2"
edition = "2024"
description = "chematic → WASM bridge for Electron renderer"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
chematic = { workspace = true }
chematic-inchi = { workspace = true }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
