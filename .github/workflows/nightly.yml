name: Nightly Build & Analysis

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Nightly Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates'

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: electron
        run: npm run build:wasm:release

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Build WASM (nodejs target, for real-WASM contract tests)
        working-directory: electron
        run: npm run build:wasm:test

      - name: Run all tests
        working-directory: electron
        run: npm test

      - name: Performance benchmarks
        working-directory: electron
        run: npm run test:perf

      - name: Build application
        working-directory: electron
        run: npm run package

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        working-directory: electron
        run: npm audit --audit-level=moderate

      - name: Run cargo audit
        run: cargo audit

  dependency-check:
    name: Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check npm outdated
        working-directory: electron
        run: npm outdated

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust dependencies
        run: cargo outdated
