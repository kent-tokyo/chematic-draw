name: Nightly Build & Analysis

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Nightly Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Check workflow and version invariants
        working-directory: electron
        run: npm run check:ci-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates'

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build WASM
        working-directory: electron
        run: npm run build:wasm:release

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Build WASM (nodejs target, for real-WASM contract tests)
        working-directory: electron
        run: npm run build:wasm:test

      - name: Run all tests
        working-directory: electron
        run: npm test

      - name: Performance benchmarks
        working-directory: electron
        run: npm run test:perf

      - name: Build application
        working-directory: electron
        run: npm run package

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The packaged application has no production dependency advisories.
      # Forge, Electron and the other build/test tools are devDependencies;
      # their current transitive advisories must remain visible, but should
      # not block the runtime security gate or force a major Forge downgrade.
      - name: Run npm audit (runtime dependencies)
        working-directory: electron
        run: npm audit --omit=dev --audit-level=moderate

      - name: Report npm audit (development dependencies)
        working-directory: electron
        continue-on-error: true
        run: npm audit --audit-level=moderate

      # if: always() below so a real npm audit finding (above) doesn't hide
      # whether cargo audit itself runs cleanly - without it, a step
      # failure stops the rest of the job and this would never be exercised.
      - name: Setup Rust
        if: always()
        uses: dtolnay/rust-toolchain@stable

      # cargo-audit isn't a stock cargo subcommand — it was never installed
      # here, so this job has been failing on "no such subcommand: audit"
      # since the day it was written, not from an actual finding.
      - name: Install cargo-audit
        if: always()
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        if: always()
        run: cargo audit

  dependency-check:
    name: Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check npm outdated
        working-directory: electron
        run: npm outdated || true # npm outdated exits 1 whenever anything is outdated - informational, not a failure

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Same issue as cargo-audit above: cargo-outdated needs an explicit
      # install, it isn't bundled with cargo.
      - name: Install cargo-outdated
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-outdated

      - name: Check Rust dependencies
        run: cargo outdated || true # informational, not a failure

  # Reporting only, not a gate: generates an SBOM and a license inventory
  # as workflow artifacts. Deciding which licenses are acceptable is a
  # legal/policy call this workflow doesn't make — it surfaces what's in
  # use so a human can.
  sbom-and-license:
    name: SBOM & License Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 'Generate SBOM (SPDX, whole repo: Cargo + npm)'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Install cargo-license
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-license

      - name: Rust license report
        run: cargo license --json > rust-licenses.json

      - name: npm license report
        working-directory: electron
        run: npx --yes license-checker --json > ../npm-licenses.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-licenses
          path: |
            sbom.spdx.json
            rust-licenses.json
            npm-licenses.json
          retention-days: 90
