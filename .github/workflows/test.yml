name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates'

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: electron
        run: npm run build:wasm

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: TypeScript Check
        working-directory: electron
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates'

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: electron
        run: npm run build:wasm

      - name: Install JavaScript dependencies
        working-directory: electron
        run: npm ci

      - name: Build WASM (nodejs target, for real-WASM contract tests)
        working-directory: electron
        run: npm run build:wasm:test

      - name: Run Unit Tests
        working-directory: electron
        run: npm run test:coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: electron/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates'

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: electron
        run: npm run build:wasm

      - name: Install JavaScript dependencies
        working-directory: electron
        run: npm ci

      - name: Install Playwright browsers
        working-directory: electron
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        working-directory: electron
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: electron/playwright-report/
          retention-days: 30

  electron-smoke:
    name: Electron Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates'

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: electron
        run: npm run build:wasm

      - name: Install JavaScript dependencies
        working-directory: electron
        run: npm ci

      - name: Package the app
        working-directory: electron
        run: npm run package

      - name: Install Xvfb (Electron needs a display server on Linux, even headless)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Electron Smoke Test
        working-directory: electron
        run: xvfb-run -a npm run test:e2e:electron

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates'

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install JavaScript dependencies
        working-directory: electron
        run: npm ci

      - name: Build WASM (nodejs target, for real-WASM performance benchmarks)
        working-directory: electron
        run: npm run build:wasm:test

      - name: Run Performance Benchmarks (real WASM smoke gate + non-blocking report)
        working-directory: electron
        run: npm run test:perf

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: electron/perf-report.json
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests, electron-smoke, performance]
    if: always()
    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.electron-smoke.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.performance.result }}" != "success" ]; then exit 1; fi
          echo "All tests passed!"
