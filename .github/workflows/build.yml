name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-gate:
    name: Release Candidate Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Check workflow and version invariants
        working-directory: electron
        run: npm run check:ci-config

      - name: Setup Rust for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates'

      - name: Install wasm-pack for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Install JavaScript dependencies for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        run: npm ci

      - name: Build browser and test WASM for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        run: |
          npm run build:wasm
          npm run build:wasm:test

      - name: Install Playwright browser for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        run: npx playwright install --with-deps chromium

      - name: Run candidate checks for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        run: npm run verify:candidate

      - name: Audit runtime dependencies for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        run: npm run audit:runtime

      - name: Run renderer and Playground E2E for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        run: |
          npm run test:e2e
          npm run test:e2e:playground

      - name: Install Xvfb for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Package and smoke-test tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        run: |
          npm run package
          xvfb-run -a npm run test:e2e:electron

  build:
    name: Build
    needs: release-gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Check workflow and version invariants
        working-directory: electron
        run: npm run check:ci-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates'

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build WASM Release
        working-directory: electron
        run: npm run build:wasm:release

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE_BASE64" ]; then
            echo "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/chematic-draw-signing.pfx"
            echo "WIN_CSC_LINK=$RUNNER_TEMP/chematic-draw-signing.pfx" >> "$GITHUB_ENV"
          fi

      - name: Verify release signing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RUNNER_OS: ${{ runner.os }}
          GITHUB_REF: ${{ github.ref }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Until Apple credentials are configured, publish the macOS zip as
          # explicitly unsigned. Credentials still take precedence when set.
          ALLOW_UNSIGNED_MACOS: 'true'
        run: ./scripts/verify-signing-env.sh

      - name: Prepare macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/chematic-draw-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"
            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/chematic-draw-signing.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$RUNNER_TEMP/chematic-draw-signing.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"
          fi

      - name: Build Application
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run make

      # Named per-platform (not a shared SHA256SUMS.txt) so all three land as
      # distinctly-named release assets — a single shared name across the
      # three separately-uploaded artifact sets would collide when
      # softprops/action-gh-release tries to attach all of them by basename.
      - name: Generate checksums
        shell: bash
        working-directory: electron/out/make
        run: |
          # sha256sum ships on Linux and in Windows' Git Bash; macOS has
          # shasum -a 256 instead (no GNU coreutils by default).
          while IFS= read -r -d '' artifact; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$artifact"
            else
              shasum -a 256 "$artifact"
            fi
          done < <(find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.exe' -o -name '*.nupkg' \) -print0) \
            > "SHA256SUMS-${{ runner.os }}.txt"
          test -s "SHA256SUMS-${{ runner.os }}.txt"
          cat "SHA256SUMS-${{ runner.os }}.txt"

      # forge.config.js's actual makers: maker-deb + maker-rpm on Linux,
      # maker-zip on macOS, maker-squirrel (Setup.exe) on Windows — no
      # AppImage or DMG maker is configured. The previous globs (*.AppImage,
      # *.dmg) never matched anything on Linux/macOS, and
      # if-no-files-found: ignore silently turned that into an empty
      # artifact upload instead of a build failure. `error` here is
      # intentional: a maker producing nothing should fail the job, not
      # ship an empty release asset.
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            electron/out/make/**/*.deb
            electron/out/make/**/*.rpm
            electron/out/make/SHA256SUMS-Linux.txt
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          path: |
            electron/out/make/**/*.zip
            electron/out/make/SHA256SUMS-macOS.txt
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: |
            electron/out/make/**/*.exe
            electron/out/make/**/*.nupkg
            electron/out/make/SHA256SUMS-Windows.txt
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          # A tag with a semver pre-release identifier (v1.2.3-rc.1,
          # -beta, -alpha, ...) is a pre-release by definition - marking it
          # otherwise on GitHub would present a release-candidate as
          # stable/latest to anyone browsing releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (replace existing files)
        shell: bash
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find linux-binaries macos-binaries windows-binaries -type f -print0)
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
