name: Playground Pages

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'electron/src/playground.tsx'
      - 'electron/src/index.css'
      - 'electron/src/renderer.tsx'
      - 'electron/src/renderer/**'
      - 'electron/src/engineMetadata.ts'
      - 'electron/e2e/playground/**'
      - 'electron/e2e/renderer/**'
      - 'electron/playwright.playground.config.ts'
      - 'electron/scripts/serve-playground.mjs'
      - 'packages/**'
      - 'electron/src/renderer/wasm/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'electron/package.json'
      - 'electron/package-lock.json'
      - 'electron/vite.renderer.config.mjs'
      - '.github/workflows/playground-pages.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: npm ci
        working-directory: electron
      - run: npx playwright install --with-deps chromium
        working-directory: electron
      - run: npm run build:wasm:release
        working-directory: electron
      - run: npm run build:playground
        working-directory: electron
      - run: npm run test:e2e:playground
        working-directory: electron
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: electron/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
