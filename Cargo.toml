[workspace]
members = [".", "crates/chem-ui", "crates/chem-io", "crates/chem-wasm"]
resolver = "2"

[workspace.dependencies]
chematic   = { version = "0.1.32", features = ["full"] }
egui       = "0.34"
eframe     = { version = "0.34", features = ["default_fonts", "persistence"] }
serde      = { version = "1", features = ["derive"] }
toml       = "0.8"
quick-xml  = { version = "0.40", features = ["serialize"] }
reqwest    = { version = "0.13", features = ["json", "blocking"] }
arboard    = "3"
resvg      = "0.47"
serde_json = "1"

[package]
name        = "chematic-draw"
version     = "0.1.0"
edition     = "2021"
description = "Open-source chemical structure editor — ChemDraw/Ketcher/ChemSketch drop-in replacement"
license     = "MIT OR Apache-2.0"

[[bin]]
name = "chematic-draw"
path = "src/main.rs"

[dependencies]
chem-ui   = { path = "crates/chem-ui" }
chem-io   = { path = "crates/chem-io" }
eframe    = { workspace = true }
egui      = { workspace = true }
