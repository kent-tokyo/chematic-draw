[workspace]
members = ["crates/chem-wasm"]
resolver = "2"

[workspace.dependencies]
chematic       = { git = "https://github.com/kent-tokyo/chematic.git", tag = "v1.0.1", features = ["full"] }
chematic-inchi = { git = "https://github.com/kent-tokyo/chematic.git", tag = "v1.0.1" }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

[profile.release]
opt-level = 3
lto = true
